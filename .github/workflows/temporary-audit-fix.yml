name: Temporary audit fix

on:
  push:
    branches:
      - chatgpt/dependency-security

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply nonbreaking audit fixes
        run: npm audit fix
      - name: Commit dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply nonbreaking dependency security fixes"
          git push origin HEAD:chatgpt/dependency-security
