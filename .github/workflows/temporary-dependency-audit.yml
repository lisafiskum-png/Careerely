name: Temporary dependency audit

on:
  push:
    branches:
      - chatgpt/dependency-security

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit after framework upgrade
        run: npm audit --json || true
