name: Temporary dependency upgrade

on:
  push:
    branches:
      - chatgpt/dependency-security

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade patched Next.js packages
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to patched 16.3.8"
          git push origin HEAD:chatgpt/dependency-security
